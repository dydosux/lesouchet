name: Build Android APK Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Next.js Static Export
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Build Android APK (Debug / Test)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK for Release
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [[ "$VERSION" != v* ]]; then VERSION="v1.1.0"; fi
          cp android/app/build/outputs/apk/debug/app-debug.apk "./LesoUchet-${VERSION}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk ./app-debug.apk
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LesoUchet-Android-APK
          path: ./LesoUchet-*.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION || 'v1.1.0' }}
          name: "ЛесоУчёт ${{ env.VERSION || 'v1.1.0' }} — реальное OCR"
          body: |
            ### 📱 ЛесоУчёт — полностью рабочее OCR-приложение
            
            **Скачайте `LesoUchet-v1.1.0.apk` или `app-debug.apk` и установите на телефон.**
            
            ### Что реально работает в этой версии:
            * 📸 **Настоящее OCR** через Tesseract.js (рус + eng) прямо на телефоне
            * 📊 Разбор таблицы размеров, 1/2 сорта, бруса и горбыля
            * 🌲 Кубатура кругляка по **ГОСТ 2708-75**
            * 💰 Зарплата: `куб × 1600` + `горбыль × 25`
            * 📉 Выход леса с округлением **вниз**
            * ✏️ Ручная правка любой ячейки после распознавания
            * 📁 Экспорт Excel / CSV
            
            > Первый запуск OCR требует интернет (скачиваются языковые модели ~15 МБ). Дальше работает офлайн.
          files: |
            ./LesoUchet-*.apk
            ./app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
