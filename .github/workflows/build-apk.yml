name: Build Android APK Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Next.js Static Export
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Build Android APK (Debug / Test)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK for Release
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [[ "$VERSION" != v* ]]; then VERSION="v1.2.0"; fi
          cp android/app/build/outputs/apk/debug/app-debug.apk "./LesoUchet-${VERSION}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk ./app-debug.apk
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LesoUchet-Android-APK
          path: ./LesoUchet-*.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION || 'v1.2.0' }}
          name: "ЛесоУчёт ${{ env.VERSION || 'v1.2.0' }} — Gemini Vision OCR"
          body: |
            ### ЛесоУчёт — точное чтение бланков через Gemini Vision
            
            Скачайте `LesoUchet-v1.2.0.apk` и установите.
            
            ### Важно для точности
            1. Откройте приложение → ⚙ Настройки
            2. Создайте бесплатный ключ: https://aistudio.google.com/apikey
            3. Вставьте API key и выберите **Gemini Vision**
            4. Снимите бланк → модель читает рукопись и считает кубатуру/зарплату
            
            Tesseract оставлен только как слабый офлайн-запасной вариант.
          files: |
            ./LesoUchet-*.apk
            ./app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
