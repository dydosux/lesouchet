name: Build Android APK Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Next.js Static Export
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Build Android APK (Debug / Test)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK for Release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./LesoUchet-v1.0.0.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk ./app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LesoUchet-Android-APK
          path: ./LesoUchet-v1.0.0.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "ЛесоУчёт v1.0.0 (Готовый APK на телефон)"
          body: |
            ### 📱 Готовое Android-приложение «ЛесоУчёт» (APK)
            
            **Скачайте прикрепленный файл `LesoUchet-v1.0.0.apk` или `app-debug.apk` на смартфон и установите.**
            
            ---
            
            ### 🌲 Возможности приложения:
            * 📸 **Распознавание бланков учёта распиловки древесины** (автономно / без токенов).
            * 🌲 **Автоматический расчёт кубатуры круглого леса** по официальной таблице **ГОСТ 2708-75 (6.0 м)**.
            * 📦 **Кубатура готовой продукции** (1 сорт + 2 сорт + брус).
            * 💰 **Расчёт зарплаты бригады:**
              * Готовая продукция: `кубатура × 1600 руб/м³`
              * Горбыль 2м (штакет/доска необрезная): `штуки × 25 руб/шт`
              * Процент выхода леса (округление **всегда в меньшую сторону**).
            * 📊 **Экспорт в Excel (.xlsx)** и **CSV (1С)**.
          files: |
            ./LesoUchet-v1.0.0.apk
            ./app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
